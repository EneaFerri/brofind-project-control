<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or 'Brofind Project Control' }}</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header><div class="brand"><div class="logo">B</div><div><strong>BROFIND</strong><span>PROJECT CONTROL</span></div></div><div class="header-right"><span class="version">V{{version or '0.3'}}</span><form method="post" action="/login" class="role-switch"><label>Vista</label><select name="username" onchange="this.form.submit()">{% for u in users %}<option value="{{u.username}}" {% if u.username==user.username %}selected{% endif %}>{{u.display_name}}</option>{% endfor %}</select></form></div></header>
<main>{% block content %}{% endblock %}</main><script src="/static/app.js"></script></body></html>
